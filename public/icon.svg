<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2a0b52"/>
      <stop offset="55%" stop-color="#12062a"/>
      <stop offset="100%" stop-color="#07030f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f3e8ff"/>
      <stop offset="55%" stop-color="#c084fc"/>
      <stop offset="85%" stop-color="#7e22ce" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#7e22ce" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0abfc"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="mark">
    <circle cx="256" cy="256" r="190" fill="url(#halo)"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="#d8b4fe" stroke-width="3" stroke-dasharray="3 12" opacity=".6"/>
    <circle cx="256" cy="256" r="146" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round" stroke-dasharray="120 26 30 26 200 40" filter="url(#glow)" transform="rotate(-30 256 256)"/>
    <circle cx="256" cy="256" r="112" fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="150 60 60 60 110 264" filter="url(#glow)" transform="rotate(20 256 256)"/>
    <polygon points="256,170 330.5,213 330.5,299 256,342 181.5,299 181.5,213" fill="rgba(168,85,247,.08)" stroke="#c084fc" stroke-width="2" opacity=".7"/>
    <circle cx="256" cy="256" r="78" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="18" fill="#fff" opacity=".9" filter="url(#glow)"/>
  </g>
</svg>
